# Project-wide Gradle settings.

# Min supported version: 2.9.0
pariVersion=2.9.0

# Default: arm64-v8a,x86_64
#nativeAbis=arm64-v8a,armeabi-v7a,x86,x86_64

# Memory & JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Modern AGP defaults & performance optimizations
android.useAndroidX=true
android.dependency.excludeLibraryComponentsFromConstraints=true

# Enable AGP 9+ Kotlin DSL features
android.builtInKotlin=true
android.newDsl=true

# Code style
kotlin.code.style=official
